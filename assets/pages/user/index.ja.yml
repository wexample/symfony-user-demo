    locked: 拒否されました。アカウントはロックされています
    inactive: 拒否されました。アカウントはアクティベートされていません
magic_link:
  title: マジックリンク
  intro: デモはメールを送信しません。リンクはデモ用メールボックスに届き、あなたのみに表示されます。
