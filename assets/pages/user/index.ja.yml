page_title: ユーザー
page_icon: 'ph:bold/user'
intro: symfony-userのログインフォームがajax経由で送信されます。以下のテストアカウントのいずれかを使用して、メールアドレスまたはユーザー名でサインインしてください。まだ信頼されていないデバイスでは、パスワードの後にデモ用メールボックスに届くコードが必要です。
signed_in: '%name% としてサインインしました。'
