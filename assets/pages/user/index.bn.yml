intro: 'সিম্ফনি-ইউজারের লগইন ফর্ম, AJAX এর মাধ্যমে জমা দেওয়া। নিচের পরীক্ষামূলক অ্যাকাউন্টগুলির মধ্যে একটি দিয়ে সাইন ইন করুন, ইমেল বা ব্যবহারকারীর নাম দ্বারা। একটি ডিভাইসে যে এখনও বিশ্বাসযোগ্য নয়, সেখানে একটি কোড পাসওয়ার্ডের পরে আসে, যা ডেমো মেইলবক্সে পাঠানো হয়।'
