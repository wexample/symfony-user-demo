intro: 'symfony-user का लॉगिन फॉर्म, ajax के माध्यम से सबमिट किया गया। नीचे दिए गए परीक्षण खातों में से किसी एक से, ईमेल या उपयोगकर्ता नाम द्वारा साइन इन करें। एक ऐसे डिवाइस पर जो अभी तक विश्वसनीय नहीं है, पासवर्ड के बाद एक कोड आवश्यक है, जो डेमो मेलबॉक्स में भेजा गया है।'
