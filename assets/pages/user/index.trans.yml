es:
  page_title: Usuario
  page_icon: 'ph:bold/user'
  intro: 'El formulario de inicio de sesión de symfony-user, enviado a través de ajax. Inicia sesión con una de las cuentas de prueba a continuación, por correo electrónico o por nombre de usuario. En un dispositivo que aún no es de confianza, se requiere un código después de la contraseña, enviado a la bandeja de entrada de demostración.'
  signed_in: 'Conectado como %name%.'
  accounts:
    title: 'Cuentas de prueba'
    email: 'Correo electrónico'
