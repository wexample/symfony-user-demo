fa:
  page_title: کاربر
  page_icon: 'ph:bold/user'
  intro: 'فرم ورود symfony-user که از طریق ajax ارسال می‌شود. با یکی از حساب‌های آزمایشی زیر، از طریق ایمیل یا نام کاربری وارد شوید. در دستگاهی که هنوز مورد اعتماد نیست، یک کد پس از گذرواژه ارسال می‌شود که به ایمیل فرستاده شده است.'
  signed_in: 'وارد شده به عنوان %name%.'
  accounts:
    title: 'حساب‌های آزمایشی'
    email: ایمیل
    username: 'نام کاربری'
    password: 'رمز عبور'
    expected: نتیجه
    missing: 'حساب‌های آزمایشی هنوز وجود ندارند.'
    create: 'آن‌ها را ایجاد کنید'
    reset_intro: 'یک بازدیدکننده رمز عبور را تغییر داده یا قفل شده است؟'
    reset: 'حساب‌های آزمایشی را بازنشانی کنید'
    result:
      active: 'کد ارسال شده به ایمیل را می‌خواهد، سپس وارد می‌شود'
      locked: 'رد شد، حساب قفل شده است'
      inactive: 'رد شد، حساب فعال نشده است'
      admin: 'وارد می‌شود و حساب‌های دیگر را مدیریت می‌کند'
  magic_link:
    title: 'لینک جادویی'
    intro: 'لینک به ایمیل ارسال می‌شود. در حالت توسعه، به جای خروج از دستگاه در صندوق ورودی قرار می‌گیرد.'
  signup:
    title: 'تونل ثبت‌نام'
    intro: 'مراحل ایمیل و ورود symfony-user در یک تونل. یک آدرس با یک حساب درخواست ورود می‌کند؛ هر آدرس دیگری یک حساب ایجاد می‌کند که فعال نشده است.'
