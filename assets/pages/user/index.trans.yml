en:
  page_title: User
  page_icon: ph:bold/user
  intro: The login form of symfony-user, submitted over ajax. Sign in with one of the test accounts below, by email or by username. On a device not trusted yet, a code follows the password, sent by email.
  signed_in: Signed in as %name%.
  accounts:
    title: Test accounts
    email: Email
    username: Username
    password: Password
    expected: Result
    missing: The test accounts do not exist yet.
    create: Create them
    reset_intro: A visitor changed a password or locked themselves out?
    reset: Reset the test accounts
    result:
      active: Asks the code sent by email, then signs in
      locked: Refused, the account is locked
      inactive: Refused, the account is not activated
      admin: Signs in, and administers the other accounts
  magic_link:
    title: Magic link
    intro: The link is sent by email. In development, it lands in the mailbox instead of leaving the machine.
  signup:
    title: Sign-up tunnel
    intro: The email and login steps of symfony-user, in a tunnel. An address with an account asks to sign in; any other one creates an account, not activated.
    open: Walk the tunnel
  forgot:
    title: Forgotten password
    intro: The reset link is sent by email too.
  action:
    forgot: Forgot your password?
    mailbox: Open the mailbox
    authenticator: Authenticator app code
    profile: My account
    teams: Teams
    accounts: Accounts
    logout: Sign out
  login:
    title: Sign in

ar:
  page_title: المستخدم
  page_icon: 'ph:bold/user'
  intro: 'نموذج تسجيل الدخول لـ symfony-user، يتم إرساله عبر ajax. قم بتسجيل الدخول باستخدام إحدى حسابات الاختبار أدناه، عبر البريد الإلكتروني أو اسم المستخدم. على جهاز غير موثوق به بعد، يتبع الرمز كلمة المرور، المرسلة عبر البريد الإلكتروني.'
  signed_in: 'تم تسجيل الدخول كـ %name%.'
  accounts:
    title: 'حسابات الاختبار'
    email: 'البريد الإلكتروني'
    username: 'اسم المستخدم'
    password: 'كلمة المرور'
    expected: النتيجة
    missing: 'حسابات الاختبار غير موجودة بعد.'
    create: إنشائها
    reset_intro: 'قام زائر بتغيير كلمة المرور أو أغلق حسابه؟'
    reset: 'إعادة تعيين حسابات الاختبار'
    result:
      active: 'يطلب الرمز المرسل عبر البريد الإلكتروني، ثم يسجل الدخول'
      locked: 'مرفوض، الحساب مقفول'
      inactive: 'مرفوض، الحساب غير مفعل'
      admin: 'يسجل الدخول، ويدير الحسابات الأخرى'
  magic_link:
    title: 'رابط سحري'
    intro: 'الرابط يُرسل عبر البريد الإلكتروني. في مرحلة التطوير، يصل إلى صندوق البريد بدلاً من مغادرة الجهاز.'
  signup:
    title: 'نفق التسجيل'
    intro: 'خطوات البريد الإلكتروني وتسجيل الدخول لـ symfony-user، في نفق. عنوان به حساب يطلب تسجيل الدخول؛ أي عنوان آخر ينشئ حسابًا، غير مفعل.'
    open: 'استكشاف النفق'
  forgot:
    title: 'كلمة المرور المنسية'
    intro: 'رابط إعادة التعيين يُرسل عبر البريد الإلكتروني أيضًا.'
  action:
    forgot: 'نسيت كلمة المرور؟'
    mailbox: 'فتح صندوق البريد'
    authenticator: 'رمز تطبيق المصادقة'
    profile: حسابي
    teams: الفرق
    accounts: الحسابات
    logout: 'تسجيل الخروج'
  login:
    title: 'تسجيل الدخول'

bn:
  page_title: ব্যবহারকারী
  page_icon: 'ph:bold/user'
  intro: 'symfony-user এর লগইন ফর্ম, ajax এর মাধ্যমে জমা দেওয়া হয়। নিচে দেওয়া পরীক্ষামূলক অ্যাকাউন্টগুলির মধ্যে একটি দিয়ে সাইন ইন করুন, ইমেইল বা ব্যবহারকারীর নাম দ্বারা। একটি এখনও বিশ্বস্ত ডিভাইসে, পাসওয়ার্ডের পরে একটি কোড আসে, যা ইমেইলের মাধ্যমে পাঠানো হয়।'
  signed_in: 'সাইন ইন করা হয়েছে %name% হিসাবে।'
  accounts:
    title: 'পরীক্ষামূলক অ্যাকাউন্ট'
    email: ইমেল
    username: 'ব্যবহারকারীর নাম'
    password: পাসওয়ার্ড
    expected: ফলাফল
    missing: 'পরীক্ষামূলক অ্যাকাউন্টগুলি এখনও বিদ্যমান নয়।'
    create: 'এগুলি তৈরি করুন'
    reset_intro: 'একজন দর্শক একটি পাসওয়ার্ড পরিবর্তন করেছে বা নিজেদের বাইরে বন্ধ করে দিয়েছে?'
    reset: 'পরীক্ষামূলক অ্যাকাউন্টগুলি রিসেট করুন'
    result:
      active: 'ইমেইলে পাঠানো কোডের জন্য অনুরোধ করে, তারপর সাইন ইন করে'
      locked: 'প্রত্যাখ্যান, অ্যাকাউন্টটি লক করা হয়েছে'
      inactive: 'প্রত্যাখ্যান, অ্যাকাউন্টটি সক্রিয় করা হয়নি'
      admin: 'সাইন ইন করে এবং অন্যান্য অ্যাকাউন্টগুলি পরিচালনা করে'
  magic_link:
    title: 'ম্যাজিক লিঙ্ক'
    intro: 'লিঙ্কটি ইমেইলে পাঠানো হয়। ডেভেলপমেন্টে, এটি মেইলবক্সে পড়ে যায় যন্ত্রটি ছেড়ে না।'
  signup:
    title: 'সাইন-আপ টানেল'
    intro: 'সিম্ফনি-ইউজারের ইমেল এবং লগইন পদক্ষেপ, একটি টানেলে। একটি অ্যাকাউন্টের জন্য একটি ঠিকানা সাইন ইন করার অনুরোধ করে; অন্যটি একটি অ্যাকাউন্ট তৈরি করে, যা সক্রিয় হয় না।'
    open: 'টানেলটি অতিক্রম করুন'
  forgot:
    title: 'পাসওয়ার্ড ভুলে গেছেন'
    intro: 'পুনরায় সেট করার লিঙ্কটিও ইমেইলে পাঠানো হয়।'
  action:
    forgot: 'আপনার পাসওয়ার্ড ভুলে গেছেন?'
    mailbox: 'মেইলবক্স খুলুন'
    authenticator: 'প্রমাণীকরণ অ্যাপ কোড'
    profile: 'আমার অ্যাকাউন্ট'
    teams: দল
    accounts: অ্যাকাউন্টগুলি
    logout: 'সাইন আউট'
  login:
    title: 'সাইন ইন করুন'

de:
  page_title: Benutzer
  page_icon: 'ph:bold/user'
  intro: 'Das Anmeldeformular von symfony-user, über Ajax übermittelt. Melden Sie sich mit einem der untenstehenden Testkonten an, entweder per E-Mail oder Benutzername. Auf einem noch nicht vertrauenswürdigen Gerät folgt ein Code nach dem Passwort, der per E-Mail gesendet wird.'
