fa:
  page_title: کاربر
  page_icon: 'ph:bold/user'
  intro: 'فرم ورود symfony-user که از طریق ajax ارسال می‌شود. با یکی از حساب‌های آزمایشی زیر، از طریق ایمیل یا نام کاربری وارد شوید. در دستگاهی که هنوز مورد اعتماد نیست، یک کد پس از رمز عبور ارسال می‌شود که به صندوق پستی دمو منتقل می‌شود.'
  signed_in: 'وارد شده به عنوان %name%.'
  accounts:
    title: 'حساب‌های آزمایشی'
    email: ایمیل
    username: 'نام کاربری'
    password: 'رمز عبور'
    expected: نتیجه
    missing: 'حساب‌های آزمایشی هنوز وجود ندارند.'
    create: 'آن‌ها را ایجاد کنید'
    reset_intro: 'یک بازدیدکننده رمز عبور را تغییر داده یا قفل شده است؟'
    reset: 'حساب‌های آزمایشی را بازنشانی کنید'
    result:
      active: 'کد صندوق پستی دمو را درخواست می‌کند، سپس وارد می‌شود'
      locked: 'رد شد، حساب قفل شده است'
      inactive: 'رد شد، حساب فعال نشده است'
  magic_link:
    title: 'لینک جادویی'
    intro: 'دمو هیچ ایمیلی ارسال نمی‌کند. لینک در صندوق پستی دمو قرار می‌گیرد، که فقط برای شما قابل مشاهده است.'
  signup:
    title: 'تونل ثبت‌نام'
    intro: 'مراحل ایمیل و ورود symfony-user در یک تونل. یک آدرس با یک حساب درخواست ورود می‌کند؛ هر آدرس دیگری یک حساب ایجاد می‌کند که فعال نشده است.'
    open: 'از تونل عبور کنید'
  forgot:
    title: 'رمز عبور فراموش شده'
    intro: 'لینک بازنشانی نیز در صندوق پستی دمو قرار می‌گیرد.'
  action:
    forgot: 'رمز عبور خود را فراموش کرده‌اید؟'
    mailbox: 'صندوق پستی دمو را باز کنید'
    account: حساب
    logout: خروج
  login:
    title: ورود

