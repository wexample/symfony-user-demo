page_title: 用户
page_icon: 'ph:bold/user'
intro: 'symfony-user 的登录表单，通过 ajax 提交。使用下面的测试账户之一，通过电子邮件或用户名登录。在尚未信任的设备上，密码后会跟随一个代码，发送到演示邮箱。'
