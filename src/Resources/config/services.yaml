services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyUserDemo\:
        resource: '../../{Command,Repository,Service}'

    # Overrides the mail sender of symfony-user, loaded before this bundle.
    Wexample\SymfonyUser\Interface\SecurityLinkSenderInterface:
        alias: Wexample\SymfonyUserDemo\Service\SessionSecurityLinkSenderService

    Wexample\SymfonyUserDemo\Controller\:
        resource: '../../Controller/'
        exclude: '../../Controller/**/Abstract*.php'
        tags: ['controller.service_arguments']
